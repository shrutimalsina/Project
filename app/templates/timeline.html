{% extends "base.html" %}

{% block content %}
<section class="section-shell reveal">
    <div class="section-heading">
        <h1>Timeline</h1>
        <p>Short updates, project wins, and learning moments.</p>
    </div>

    <div class="timeline-layout">
        <form id="timeline-form" class="glass-card timeline-form" novalidate>
            <h2>Share an update</h2>
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Your name" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label for="content">Content</label>
                <textarea id="content" name="content" rows="4" placeholder="What did you build today?" required></textarea>
            </div>
            <button id="timeline-submit" class="btn btn-primary" type="submit">Post update</button>
            <p id="timeline-status" class="status-message" role="status" aria-live="polite"></p>
        </form>

        <section class="glass-card timeline-feed" aria-live="polite">
            <div class="feed-head">
                <h2>Recent posts</h2>
                <button id="timeline-refresh" class="chip chip-button" type="button">Refresh</button>
            </div>
            <div id="timeline-loading" class="muted">Loading posts…</div>
            <div id="posts-list" class="stacked-list"></div>
            <p id="timeline-empty" class="muted" hidden>No posts yet. Be the first one to share an update.</p>
        </section>
    </div>
</section>
{% endblock %}
