<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta property="og:title" content="Personal Portfolio">
    <meta property="og:description" content="My Personal Portfolio">
    <meta property="og:url" content="{{ url }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='styles/main.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='img/favicon.ico') }}" type="image/x-icon">
    <title>{{ title }}</title>
</head>

<body>
    <header class="site-header">
        <nav class="nav-shell">
            <a class="home-link" href="{{ url_for('index') }}" aria-label="Home">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M12 3.2 3.7 10v10.2h6.1v-6.2h4.4v6.2h6.1V10L12 3.2Zm6.8 15.6h-3.3v-6.2H8.5v6.2H5.2v-8.1L12 5.9l6.8 5.6v7.3Z"></path>
                </svg>
            </a>
            <button class="menu-toggle" aria-expanded="false" aria-controls="primary-navigation" type="button">Menu</button>
            <div class="nav-links" id="primary-navigation">
                {% for link in links %}
                <a href="{{ url_for('index') }}#{{ link.section }}">{{ link.name }}</a>
                {% endfor %}
            </div>
            <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark and light mode">Theme</button>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <p>© {{ user.name if user else 'Portfolio' }} · Built with Flask + vanilla JS</p>
            <div class="footer-links">
                {% for c in contact %}
                <a href="{{ c.href }}" {% if c.href.startswith('http') %}target="_blank" rel="noopener"{% endif %}>{{ c.label }}</a>
                {% endfor %}
            </div>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='scripts/main.js') }}"></script>
</body>

</html>
