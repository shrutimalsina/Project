<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta property="og:title" content="Personal Portfolio">
    <meta property="og:description" content="My Personal Portfolio">
    <meta property="og:url" content="{{ url }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='styles/main.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='img/favicon.ico') }}" type="image/x-icon">
    <title>{{ title }}</title>
</head>

<body>
    <header class="site-header">
        <nav class="nav-shell">
            <a class="brand" href="{{ url_for('index') }}">
                <img class="nav-logo" src="{{ url_for('static', filename='img/logoipsum-custom-logo.svg') }}" alt="Home">
                <span>Portfolio</span>
            </a>
            <button class="menu-toggle" aria-expanded="false" aria-controls="primary-navigation" type="button">Menu</button>
            <div class="nav-links" id="primary-navigation">
                <a href="{{ url_for('index') }}">Home</a>
                {% for link in links %}
                <a href="{{ url_for(link.endpoint) }}">{{ link.name }}</a>
                {% endfor %}
                <a href="{{ url_for('timeline') }}">Timeline</a>
            </div>
            <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark and light mode">Theme</button>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <p>© {{ user.name if user else 'Portfolio' }} · Built with Flask + vanilla JS</p>
            <div class="footer-links">
                {% for c in contact %}
                <a href="{{ c.href }}" {% if c.href.startswith('http') %}target="_blank" rel="noopener"{% endif %}>{{ c.label }}</a>
                {% endfor %}
            </div>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='scripts/main.js') }}"></script>
</body>

</html>
